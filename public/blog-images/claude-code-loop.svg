<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 280' width='800' height='280' role='img' aria-label='Sơ đồ vòng làm việc: giao việc, đọc codebase, sửa và chạy, kiểm tra' font-family='system-ui, -apple-system, Segoe UI, sans-serif'>
<rect width='800' height='280' rx='16' fill='#ffffff' stroke='#e5e7eb'/>
<defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto'><path d='M0 0L10 5L0 10z' fill='#6b7280'/></marker></defs><text x='400' y='44' font-size='21' fill='#111827' font-weight='700' text-anchor='middle'>Vòng làm việc của Claude Code</text><rect x='30' y='80' width='164' height='90' rx='12' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/><text x='112.0' y='121.0' font-size='19' fill='#111827' font-weight='700' text-anchor='middle'>Bạn giao việc</text><text x='112.0' y='145.0' font-size='14' fill='#4b5563' font-weight='400' text-anchor='middle'>mô tả bằng lời</text><path d='M194 125 L220 125' fill='none' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='222' y='80' width='164' height='90' rx='12' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/><text x='304.0' y='121.0' font-size='19' fill='#111827' font-weight='700' text-anchor='middle'>Đọc codebase</text><text x='304.0' y='145.0' font-size='14' fill='#4b5563' font-weight='400' text-anchor='middle'>tìm file liên quan</text><path d='M386 125 L412 125' fill='none' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='414' y='80' width='164' height='90' rx='12' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/><text x='496.0' y='121.0' font-size='19' fill='#111827' font-weight='700' text-anchor='middle'>Sửa và chạy</text><text x='496.0' y='145.0' font-size='14' fill='#4b5563' font-weight='400' text-anchor='middle'>sửa file, chạy lệnh</text><path d='M578 125 L604 125' fill='none' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><rect x='606' y='80' width='164' height='90' rx='12' fill='#fff7ed' stroke='#c2410c' stroke-width='1.5'/><text x='688.0' y='121.0' font-size='19' fill='#111827' font-weight='700' text-anchor='middle'>Kiểm tra</text><text x='688.0' y='145.0' font-size='14' fill='#4b5563' font-weight='400' text-anchor='middle'>test, build</text><path d='M688 170 C688 245 304 245 304 174' fill='none' stroke='#6b7280' stroke-width='2' marker-end='url(#a)'/><text x='496' y='252' font-size='15' fill='#4b5563' font-weight='400' text-anchor='middle'>chưa đạt thì quay lại sửa</text>
